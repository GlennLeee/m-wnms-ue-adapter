syntax = "proto3";
package com.biskitlab.awnms.proto.model;
option go_package = "../model";

message Plane {
	string id = 1;
	optional string description = 2;
	string deviceName = 3;
	string deviceType = 4;
	optional string role = 5;
	optional string ipv4 = 6;
	optional string ipv6 = 7;
	uint64 timestamp = 8;
	optional string macAddress = 9;
	optional string model = 10;
	optional string serial = 11;
	string status = 12;
	optional int32 uptime = 13;
	optional string uptimeStr = 14;
	string version = 15;
	optional string apVersion = 16;
	optional string hostname = 17;
}
