syntax = "proto3";
package com.biskitlab.awnms.proto.model;
option go_package = "../model";

message EventReport {
	repeated EventMessage eventList = 1;
	int32 eventNum = 2;
	int64 timestamp = 3;	// message converted time
}


message EventMessage {
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description GPB version
	 * @since 3.5
	 */
	uint32 version = 1;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event code
	 * @since 3.5
	 */
	uint32 eventCode = 2;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event type
	 * @since 3.5
	 */
	optional string eventType = 3;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event main category
	 * @since 3.5
	 */
	string mainCategory = 4;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event sub category
	 * @since 3.5
	 */
	optional string subCategory = 5;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Domain UUID
	 * @since 3.5
	 */
	optional string domainId = 6;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Zone UUID. Unique zone ID (for example, b381206b-2e5d-43dc-b249-e36ffae9855c) assigned by the controller.
	 * @since 3.5
	 */
	optional string zoneId = 7;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description AP Group identifier
	 * @since 3.5
	 */
	optional string apGroupId = 8;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Access Point  MAC address
	 * @since 3.5
	 */
	optional string apMac = 9;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description UE/Client MAC address if the events are related to client
	 * @since 3.5
	 */
	optional string clientMac = 10;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event timestamp (UTC time)
	 * @since 3.5
	 */
	uint64 timestamp = 11;

	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event severity
	 * @since 3.5
	 */
	string severity = 13;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Reason for the event to occur.
	 * @since 3.5
	 */
	optional string reason = 14;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Domain name.
	 * @since 3.5
	 */
	optional string domainName = 15;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Zone name. Zone name assigned by the controller . The admin configures the Zone name via the contoller's user interface. The controller passes it to the AP.  AP retains the zone name.
	 * @since 3.5
	 */
	optional string zoneName = 16;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description AP Group name
	 * @since 3.5
	 */
	optional string apGroupName = 17;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description IPv4 address of the AP
	 * @since 3.5
	 */
	optional string apIpAddress = 18;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description IPv6 address of the AP
	 * @since 3.5
	 */
	optional string apIpv6Address = 19;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description description of the event
	 * @since 3.5
	 */
	string description = 20;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description disconnectReason of the event
	 * @since 3.5
	 */
	optional string disconnectReason = 21;

	string vendor = 41;
	string networkType = 42;
}